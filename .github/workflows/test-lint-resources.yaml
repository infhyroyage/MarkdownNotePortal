name: Run Tests and Lint in AWS CDK before Merging Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/test-lint-resources.yaml
      - resources/**

env:
  NODE_VERSION: "24.13.0"

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  test-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          cd resources
          npm ci

      - name: Run Unittests with Coverage
        run: |
          cd resources
          npm run test

  lint-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          cd resources
          npm ci

      - name: Run Lint
        run: |
          cd resources
          npm run lint
